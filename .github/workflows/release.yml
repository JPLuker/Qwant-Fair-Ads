name: Verify and publish Chromium extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwant-fair-ads-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validate source and browser behavior
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate source, permissions, and syntax
        run: python3 tests/verify_extension.py
      - name: Install browser test dependency
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check 'playwright==1.56.0'
      - name: Test sponsored results in Chromium
        run: .venv/bin/python tests/browser_smoke.py

  publish:
    name: Create tagged, verified pre-release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out full history for release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Select version and check existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          tag="v$version-untested-chromium"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; checking no extension code changed without a version bump."
            for file in manifest.json content.js content.css popup.html popup.js; do
              if ! cmp -s <(git show "$tag:$file") "$file"; then
                echo "Extension code changed without a new manifest version: $file" >&2
                exit 1
              fi
            done
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Tag the verified source commit
        if: steps.release.outputs.publish == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA" || {
              echo "Tag $TAG belongs to another commit; stopping."; exit 1;
            }
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          remote=$(git ls-remote origin "refs/tags/$TAG" | awk 'NR==1 {print $1}')
          test "$remote" = "$GITHUB_SHA" || { echo 'Remote tag not verified'; exit 1; }
      - name: Package tagged source and create checksums
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          asset="Qwant-Fair-Ads-$VERSION-Chromium-UNTESTED.zip"
          git archive --format=zip --output="$asset" "$TAG" \
            manifest.json content.js content.css popup.html popup.js README.md LICENSE PRIVACY.md
          python3 - "$asset" "$VERSION" <<'PY'
          import json, sys, zipfile
          name, version = sys.argv[1:]
          required = {'manifest.json', 'content.js', 'content.css', 'popup.html', 'popup.js', 'README.md', 'LICENSE', 'PRIVACY.md'}
          with zipfile.ZipFile(name) as z:
              assert required.issubset(z.namelist()), 'Missing release asset'
              assert all(z.getinfo(p).file_size > 0 for p in required), 'Empty release asset'
              assert json.loads(z.read('manifest.json'))['version'] == version, 'Wrong manifest version'
              assert z.testzip() is None, 'Corrupt ZIP'
          print('PASS: tagged ZIP contents and manifest')
          PY
          sha256sum "$asset" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish GitHub pre-release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          asset="Qwant-Fair-Ads-$VERSION-Chromium-UNTESTED.zip"
          cat > /tmp/qwant-release-notes.md <<EOF
          > ⚠️ **UNTESTED BUILD.** These Chromium extension builds were produced automatically and have not been run by a person. They may not install, launch, or work correctly. For tested builds, use the [stable releases page](https://github.com/$GITHUB_REPOSITORY/releases). No stable v$VERSION release is available yet.

          $(cat RELEASE_NOTES.md)

          **Unsigned:** Load this unpacked extension through Developer mode. No store package or automatic update channel is available.

          **Verification:** Python packaging checks and simulated Chromium browser tests passed. Live Qwant and real-device installation remain untested for this exact archive.

          ## Downloads
          **Chromium:** $asset (unpacked extension), plus SHA256SUMS.txt for integrity verification.
          EOF
          gh release create "$TAG" "$asset" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title "UNTESTED — Qwant Fair Ads v$VERSION (Chromium)" \
            --notes-file /tmp/qwant-release-notes.md
      - name: Download and verify published release assets
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          asset="Qwant-Fair-Ads-$VERSION-Chromium-UNTESTED.zip"
          mkdir published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published \
            --pattern "$asset" --pattern 'SHA256SUMS.txt'
          test -s "published/$asset"
          test -s published/SHA256SUMS.txt
          (cd published && sha256sum -c SHA256SUMS.txt)
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = 'true'
          echo "PASS: Published $TAG, assets match checksums and pre-release flag is set"
